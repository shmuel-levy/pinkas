<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>פנקס</title>
  <meta name="description" content="פנקס הוצאות אישי: תקציב לכל קטגוריה, התראה לפני חריגה, ומקום לחסוך.">
  <meta name="theme-color" content="#F3F0E6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C1410" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- iPhone home-screen app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="פנקס">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=IBM+Plex+Sans+Hebrew:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // apply saved theme before first paint to avoid a flash
    try {
      var t = JSON.parse(localStorage.getItem('pinkas.v1') || '{}').settings;
      if (t && (t.theme === 'light' || t.theme === 'dark')) document.documentElement.dataset.theme = t.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#view">דילוג לתוכן</a>

  <div class="app" id="app">
    <header class="top" id="top">
      <div class="top-row">
        <button class="back" id="btn-back" type="button" hidden>
          <span aria-hidden="true">→</span> חזרה
        </button>
        <h1 class="brand" id="brand">פנקס</h1>
        <button class="icon-btn" id="btn-settings" type="button" aria-label="הגדרות">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
            <path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            <circle cx="16" cy="7" r="2.2" stroke="currentColor" stroke-width="1.8" fill="none"/>
            <circle cx="10" cy="17" r="2.2" stroke="currentColor" stroke-width="1.8" fill="none"/>
          </svg>
        </button>
      </div>
      <p class="cycle" id="cycle-label"></p>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabs" id="tabs" aria-label="ניווט ראשי">
      <button type="button" data-tab="home">החודש</button>
      <button type="button" data-tab="ledger">יומן</button>
      <button type="button" class="tab-add" id="btn-add" aria-label="הוספת הוצאה"><span aria-hidden="true">+</span> הוצאה</button>
      <button type="button" data-tab="save">חיסכון</button>
      <button type="button" data-tab="insights">תובנות</button>
    </nav>
  </div>

  <!-- Add / edit expense -->
  <dialog class="sheet" id="sheet-add" aria-labelledby="add-title">
    <form method="dialog" class="sheet-body" id="add-form" novalidate>
      <div class="sheet-head">
        <h2 id="add-title">הוצאה חדשה</h2>
        <button type="button" class="link" data-close>ביטול</button>
      </div>

      <div class="amount-wrap">
        <output class="amount" id="add-amount" tabindex="-1" aria-live="polite" aria-label="סכום">₪0</output>
        <p class="impact" id="add-impact" aria-live="polite"></p>
      </div>

      <div class="place">
        <div class="add-row">
          <label class="sr-only" for="add-note">איפה, או על מה</label>
          <input id="add-note" class="field" type="text" maxlength="80" placeholder="איפה? (שופרסל, ארומה…)" autocomplete="off" autocorrect="off" enterkeyhint="done" aria-describedby="place-hint">
          <label class="sr-only" for="add-date">תאריך</label>
          <input id="add-date" class="field field-date" type="date">
        </div>
        <div class="place-list" id="place-list" role="group" aria-label="מקומות שזכרתי" hidden></div>
        <p class="place-hint" id="place-hint" aria-live="polite"></p>
      </div>

      <fieldset class="cats">
        <legend class="sr-only">קטגוריה</legend>
        <div class="cat-list" id="add-cats"></div>
      </fieldset>

      <div class="keypad" id="keypad" role="group" aria-label="מקלדת סכום">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" data-key="." aria-label="נקודה עשרונית">.</button>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key="back" aria-label="מחיקת ספרה">⌫</button>
      </div>

      <p class="form-error" id="add-error" role="alert"></p>

      <div class="sheet-actions">
        <button type="submit" class="btn btn-primary" id="add-submit">לרשום</button>
        <button type="button" class="link" id="add-spread">ביטוח או הוצאה שנתית? לפרוס על השנה</button>
        <button type="button" class="btn btn-danger-quiet" id="add-delete" hidden>מחיקת ההוצאה</button>
      </div>
    </form>
  </dialog>

  <!-- Over-budget check -->
  <dialog class="sheet sheet-alert" id="sheet-over" role="alertdialog" aria-labelledby="over-title" aria-describedby="over-text">
    <div class="sheet-body">
      <p class="over-kicker">רגע לפני</p>
      <h2 id="over-title"></h2>
      <p id="over-text" class="over-text"></p>
      <div class="sheet-actions stack">
        <button type="button" class="btn btn-primary" id="over-skip"></button>
        <button type="button" class="btn btn-line" id="over-anyway">לרשום בכל זאת</button>
        <button type="button" class="link" data-close>חזרה לעריכה</button>
      </div>
    </div>
  </dialog>

  <!-- Generic form sheet -->
  <dialog class="sheet" id="sheet-form" aria-labelledby="form-title">
    <form class="sheet-body" id="form-generic" novalidate>
      <div class="sheet-head">
        <h2 id="form-title"></h2>
        <button type="button" class="link" data-close>ביטול</button>
      </div>
      <p class="form-intro" id="form-intro" hidden></p>
      <div id="form-fields"></div>
      <p class="form-error" id="form-error" role="alert"></p>
      <div class="sheet-actions" id="form-actions"></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <p class="toast-msg" id="toast-msg"></p>
    <button type="button" class="toast-action" id="toast-action" hidden></button>
  </div>

  <noscript><p class="noscript">פנקס צריך JavaScript כדי לעבוד.</p></noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
