<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>פנקס</title>
  <meta name="description" content="פנקס הוצאות אישי: תקציב לכל קטגוריה, התראה לפני חריגה, ומקום לחסוך.">
  <meta name="theme-color" content="#F3F0E6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C1410" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- iPhone home-screen app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="פנקס">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=IBM+Plex+Sans+Hebrew:wght@400;500;700&display=swap">
  <script>
    // apply the saved theme before first paint to avoid a flash
    try {
      var t = JSON.parse(localStorage.getItem('pinkas.v1') || '{}').settings;
      if (t && (t.theme === 'light' || t.theme === 'dark')) document.documentElement.dataset.theme = t.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript><p class="noscript">פנקס צריך JavaScript כדי לעבוד.</p></noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
